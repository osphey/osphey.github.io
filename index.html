<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="韩昊辰的个人主页与社交链接。">
  <title>韩昊辰</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei", monospace;
      background: #fff;
      color: #000;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-wrap: anywhere;
      background: #fff;
    }

    main {
      width: min(100% - 40px, 560px);
      margin: 0 auto;
      padding: 56px 0;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.2;
      font-weight: 400;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 24px 0 0;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #000;
      text-decoration: none;
    }

    .link svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .link:hover,
    .link:focus-visible {
      opacity: .55;
      outline: none;
    }

    @media (max-width: 420px) {
      main { padding: 40px 0; }
      .links { gap: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>韩昊辰</h1>
    <nav class="links" aria-label="社交链接">
      <a class="link" href="https://x.com/Ospheyy" target="_blank" rel="noopener noreferrer" aria-label="X">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 4l11.733 16h4.267L8.267 4z" />
          <path d="M4 20l6.768-6.768m2.46-2.46L20 4" />
        </svg>
      </a>
      <a class="link" href="https://osphey.itch.io/" target="_blank" rel="noopener noreferrer" aria-label="itch.io">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-1l-2-3H9l-2 3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3Z" />
          <path d="M8 11v3m-1.5-1.5h3M16 11h.01M18 11h.01" />
        </svg>
      </a>
      <a class="link" href="https://github.com/osphey" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">

    </nav>

</body>
</html>
