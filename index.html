<html lang="zh-CN">
<head>

  <meta name="color-scheme" content="light">
  <meta name="description" content="韩昊辰的个人主页与社交链接。">
  <title>韩昊辰</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei", monospace;
      background: #fff;
      color: #000;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-wrap: anywhere;
      background: #fff;
    }

    main {
      width: min(100%, 560px);
      margin: 0;
      padding: 56px 20px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.25;
      font-weight: 400;
    }

    .education {
      margin: 14px 0 0;
      font-size: .95rem;
      line-height: 1.5;
    }

    .links {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 24px 0 0;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 24px;
      width: 24px;
      height: 32px;
      color: #000;
      text-decoration: none;
    }

    .link svg {
      display: block;
      width: 24px;
      height: 24px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* The official itch.io silhouette uses fill; applying the outline stroke
       would thicken the awning and close the controller's small cutouts. */
    .link .icon-itch {
      width: 24px;
      height: 24px;
      fill: currentColor;
      stroke: none;
    }

    .link:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    @media (max-width: 420px) {
      main { padding: 40px 20px; }
      .links { gap: 16px; }
    }
  </style>
</head>
